name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools

      - name: Validate theme file set
        run: ./validate.sh

      - name: QML syntax check
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            /usr/lib/qt6/bin/qmllint "$f"
          done < <(find theme/onyx -name '*.qml' -type f)
