name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qtquick

      - name: Diagnostic - Qt6 QML layout
        run: |
          echo "arch: $(uname -m)"
          echo "=== qmllint ==="; command -v qmllint || true; command -v qmllint6 || true; qmllint --version 2>&1 | head -1 || true
          echo "=== find QtQuick qmldir ==="; find /usr -name qmldir -path '*QtQuick*' 2>/dev/null | head
          echo "=== find jsroot.qmltypes ==="; find /usr -name 'jsroot.qmltypes' 2>/dev/null | head
          echo "=== find builtins.qmltypes ==="; find /usr -name 'builtins.qmltypes' 2>/dev/null | head
          echo "=== Qt qml dirs ==="; ls -d /usr/lib/*/qt6/qml /usr/lib/qt6/qml 2>/dev/null || true

      - name: Validate theme file set
        run: ./validate.sh

      - name: QML syntax check
        run: |
          set -euo pipefail
          QMLLINT=""
          for c in qmllint6 qmllint /usr/lib/qt6/bin/qmllint; do
            if command -v "$c" >/dev/null 2>&1 || [ -x "$c" ]; then
              QMLLINT="$c"
              break
            fi
          done
          [ -n "$QMLLINT" ] || { echo "qmllint not found" >&2; exit 1; }
          while IFS= read -r f; do
            "$QMLLINT" -I /usr/lib/x86_64-linux-gnu/qt6/qml --unqualified=info --import=info "$f"
          done < <(find theme/onyx -name '*.qml' -type f)
